<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculo de viagem</title>
</head>
<body>
    <script>

        var saldo = Number(window.prompt("Digite o saldo atual"))

        if(saldo >= 10000)
            {
                document.write(`O saldo atual é ${saldo}, então podemos viajar!!!`)   
            }
        else
        {
            if(saldo < 10000 && saldo >= 3000)
        {
            document.write("Vamos viajar para o brasil mesmo :(")
        }
        else
        {
            document.write("Melhor deixar gardado o dinheiro, não vamos viajar :(")
        }
        }
     
    </script>
</body>
</html>
