<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area de um triangulo !!</title>
</head>
<body>
    <script>

        alert("Calculo da área de um triangulo: ")

        var base = Number(window.prompt("Digite o valor da base de um triangulo: "))

        var altura = Number(window.prompt("Digite o valor da altura do triangulo: "))

        var area = (base*altura)/2 
        
        document.write(`A area do triangulo é: ${area}`)
    </script>
</body>
</html>
