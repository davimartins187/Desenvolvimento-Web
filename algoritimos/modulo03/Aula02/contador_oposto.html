<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
</head>
<body>
    <script>

        var numero = 10

        while(numero >= 0)
    {
        document.write(`${numero}<br>`)
        numero--
    }

    document.write("Terminei de contar!!!")

    </script>
</body>
</html>
