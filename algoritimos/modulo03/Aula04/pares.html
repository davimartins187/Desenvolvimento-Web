<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendo quais numeros são pares ou impares</title>
</head>
<body>
    <script>

        document.write("Os numeros pares são: <br> <br>")
        for(var numero = 1; numero < 51; numero++)
    {
        if(numero % 2 == 0)
    {
        document.write(`O numero ${numero} é par!!<br>`)
    }
    }
    </script>
</body>
</html>
