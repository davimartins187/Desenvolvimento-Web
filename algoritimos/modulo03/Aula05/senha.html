<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de senhas!!!</title>
</head>
<body>
    <script>

        var senha = 2026
        var resposta = undefined
        // var resposta = window.prompt("Digite a senha: ")

        while(senha != resposta)
    {
        resposta = window.prompt("Digite a senha")
        if(senha != resposta)
    {
        window.alert("Senha invalida tente novamente")
    }
    else
    {
        window.alert("Acesspo Permitido")
    }
    }
    </script>
</body>
</html>
