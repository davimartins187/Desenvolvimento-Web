<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetores em javascript</title>
</head>
<body>
    <script>

        var numero = new Array(5)
        numero[0] = 1
        numero[1] = 4
        numero[2] = 7
        numero[3] = 9
        numero[4] = 2

        for (var contador = 0; contador < 5; contador++ )
        {
            document.write(`o valor que esta na posição ${contador} do vetor numero é: ${numero[contador]}<br>`)
        }

        var n2 = [1, 4, 7, 9, 2]

        for(var c = 0; c < 5; c++)
        {
            console.log(`o valor que esta na posição ${c} do vetor n2 é: ${n2[c]}`)
        }
    </script> 
</body>
</html>
