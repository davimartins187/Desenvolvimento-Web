<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descobrindo se um numero é fatorial ou não</title>
</head>
<body>
    <script>

        var numero = +prompt("Digite o numero: ")

        function fatorial(numero)
        {
            if(numero < 0)
            {
                window.alert("não pode usar esse numero para ter um valor fatorial, tente numeros positivos")
            }

                var res = 1

                while(numero > 1)
                {
                    res = res * numero
                    numero--
                }

                return res
            
        }

        var fatorial_res = fatorial(numero)

        document.write(`O valor fatorial de ${numero} é: ${fatorial_res}`)
    </script>
</body>
</html>
