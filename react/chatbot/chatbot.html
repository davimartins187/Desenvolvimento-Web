<!DOCTYPE html>
<html>
<head>
  <title>Chatbot</title>
  <style>

    body{
      font-family: Arial, Helvetica, sans-serif;
      margin: 0px;
    }

    .send-button{
      background-color: rgb(25, 135, 84);
      color: white;
      padding: 12px 20px;
      margin-left: 10px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    } 

    .chat-input{
      padding: 12px 15px;
      border-radius: 10px;
      border: 1px solid black;
      font-size: 15px;

      flex-grow: 1;
    }

    .chat-input-container{
      display: flex;
      flex-direction: row;
      margin-bottom: 60px;
    }

    .app-container{
      max-width: 600px;
      height: 100vh;

      margin-left: auto;
      margin-right: auto;
      display: flex;
      flex-direction: column;
    }

    .chat-message-user{
      display: flex;
      justify-content: end;
      align-items: start;
    }

    .chat-message-robot{
      display: flex;
      justify-content: flex-start;
      align-items: start;
    }

    .chat-message-text{
      background-color: rgb(238, 238, 238);
      padding: 15px 20px;
      border-radius: 10px;
      margin-right: 10px;
      margin-left: 10px;
      margin-bottom: 20px;
      max-width: 300px;
    }

    .chat-message-profile{
      width: 45px;
    }

    .chat-message-container{
      flex-grow: 1;
      margin-top: 20px;
      overflow: scroll;
      scrollbar-width: none;
    }

  </style>
</head>

<body>
  <div class="js-container"></div>

  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
  <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
  <script src="https://unpkg.com/supersimpledev/babel.js"></script>

  <script type="text/babel">

    function ChatInput({ chatMessages, setChatMessages }) {

      const [inputText, setInputText] = React.useState('');
      const [isLoading, setIsLoading] = React.useState(false);

      function saveInputText(event) {
        setInputText(event.target.value);
      }

      function handleKeyDown(event) {
        if (event.key === 'Enter') {
          sendMessage();
        } else if (event.key === 'Escape') {
          setInputText('');
        }
      }

      async function sendMessage() {

        if (isLoading || inputText.trim() === '') {
          return;
        }

        const message = inputText;

        setInputText('');

        setIsLoading(true);

        const newChatMessages = [
          ...chatMessages,
          {
            message: message,
            sender: 'user',
            id: crypto.randomUUID()
          }
        ];

        setChatMessages(newChatMessages);

        setChatMessages([
          ...newChatMessages,
          {
            message: 'Loading...',
            sender: 'robot',
            id: crypto.randomUUID()
          }
        ]);

        const response = await Chatbot.getResponseAsync(message);

        setChatMessages([
          ...newChatMessages,
          {
            message: response,
            sender: 'robot',
            id: crypto.randomUUID()
          }
        ]);

        setIsLoading(false);
      }

      return (
        <div className="chat-input-container">
          <input
            placeholder="Send a message to Chatbot"
            size="30"
            value={inputText}
            onChange={saveInputText}
            onKeyDown={handleKeyDown}
            disabled={isLoading}
            className="chat-input"
          />

          <button
            onClick={sendMessage}
            disabled={isLoading || inputText.trim() === ''}
            className="send-button"
          >
            Send
          </button>
        </div>
      );
    }

    function ChatMessage({ message, sender }) {

      return (
        <div 
          className=
            {sender === 'user' ? 
              "chat-message-user":
              "chat-message-robot"
            }>
          {sender === 'robot' && (
            <img src="./img/robot.png" className="chat-message-profile"/>
          )}

          <div className="chat-message-text">
            {message}  
          </div>

          {sender === 'user' && (
            <img src="./img/user.png" className="chat-message-profile"/>
          )}
        </div>
      );
    }

    function ChatMessages({ chatMessages }) {

      const chatMessagesRef = React.useRef(null);

      React.useEffect(() => {
        const containerElem = chatMessagesRef.current;
        if(containerElem){
          containerElem.scrollTop = containerElem.scrollHeight;
        }
      }, [chatMessages])

      return (
        <div className="chat-message-container" ref={chatMessagesRef}>
          {chatMessages.map((chatMessage) => (
            <ChatMessage
              key={chatMessage.id}
              message={chatMessage.message}
              sender={chatMessage.sender}
            />
          ))}
        </div>
      );
    }

    function App() {

      const [chatMessages, setChatMessages] = React.useState([]);

      return (
        <div className="app-container">
          

          <ChatMessages
            chatMessages={chatMessages}
          />

          <ChatInput
            chatMessages={chatMessages}
            setChatMessages={setChatMessages}
          />
        </div>
      );
    }

    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(<App />);

  </script>
</body>
</html>
