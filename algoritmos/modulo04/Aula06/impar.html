<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descobrindo se um numero é par ou impar por meio de funções</title>
</head>
<body>
    <script>
        window.alert("Descobrindo se um numero é par ou impar por meio de funções")
        var numero = +prompt("Digite o numero: ")

        function par(numero)
    {
        return(numero % 2 == 0)
    }

        var res = par(numero)

        if(res === true)
        {
            document.write("O seu numero é par")
        }
        else
        {
            document.write("O seu numero é impar")
        }

    </script>
</body>
</html>
