<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impar ou Par</title>
</head>
<body>
    <script>
        window.alert("Validando numeros !!!")
        var numero = Number(window.prompt("Digite um numero: "))

    if(numero >= 0)
    {
        if(numero % 2 == 0)
        {
            document.write(`O numero ${numero} é par !!!!`)
        }   
        else
        {
            document.write(`O numero ${numero} é impar !!!`)
        }
    }
    else
    {
        document.write("Este numero não é positivo")
    }
    </script>
</body>
</html>
