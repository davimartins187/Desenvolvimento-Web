<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Média do Aluno</title>
</head>
<body>

<script>
    var nota1 = Number(prompt("Digite a primeira nota:"));
    var nota2 = Number(prompt("Digite a segunda nota:"));
    var nota3 = Number(prompt("Digite a terceira nota:"));

    if (
        nota1 < 0 || nota1 > 10 ||
        nota2 < 0 || nota2 > 10 ||
        nota3 < 0 || nota3 > 10
    ) {
        document.write("Nota inválida!");
    } else {
        var media = (nota1 + nota2 + nota3) / 3;

        if (media >= 7) {
            document.write("Você passou de ano!");
        } else if (media >= 5) {
            document.write("Você está de recuperação");
        } else {
            document.write("Reprovado");
        }
    }
</script>

</body>
</html>
