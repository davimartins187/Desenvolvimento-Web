<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Converter Fahrenheit para celsios</title>
</head>
<body>
    <script>

        alert("Converter fahrenheit para graus celsios")

        var tf = Number(window.prompt("Digite a temperatura em Fahrenheit: "))

        var tc = (tf - 32) / 1.8

        document.write(`Convertendo Fahrenheit para celsios dá: ${Math.round(tc)}`)

    </script>
</body>
</html>
