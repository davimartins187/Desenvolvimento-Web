<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media</title>
</head>
<body>
    <script>

        alert("Média de dois numeros !!!!")

        var n2 =  Number(window.prompt("Digite o primeiro numero: "))

        var n1 = Number(window.prompt("Digite o segundo numero:"))

        var res = (n1 + n2) / 2

        document.write(`A soma entre ${n1} e ${n2} é: ${res}`)
    </script>
</body>
</html>
