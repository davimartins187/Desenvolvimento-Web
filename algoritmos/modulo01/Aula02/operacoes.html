<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operações</title>
</head>
<body>
    <script>

        window.alert("Operações com dois numeros: ")

        var n1 = Number(window.prompt("Digite o primeiro numero: "))

        var n2 = Number(window.prompt("Digite o segundo numero: "))

        var adicao = n1 + n2
        var subtracao = n1 - n2
        var multiplicacao = n1 * n2
        var divisao = n1 / n2

        document.write(`A adição entre ${n1} e ${n2} é: ${adicao} <br>`)

        document.write(`A subtração entre ${n1} e ${n2} é: ${subtracao} <br>)`)

        document.write(`A multiplicação entre ${n1} e ${n2} é: ${multiplicacao
        } <br>`)

        document.write(`A divisão entre ${n1} e ${n2} é: ${divisao} <br>`)
    </script>
</body>
</html>
